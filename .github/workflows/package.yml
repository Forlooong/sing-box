name: Package reviewed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version (for example v2.0.0-rc1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml python3-cryptography
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 tests/integration_core.py --traffic
      - run: python3 tests/integration_soak_client.py
      - name: Produce explicit archive and digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?",os.environ["VERSION"])'
          git archive --format=tar.gz --output=code.tar.gz HEAD
          sha256sum code.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-release-${{ inputs.version }}
          path: |
            code.tar.gz
            SHA256SUMS
          if-no-files-found: error
